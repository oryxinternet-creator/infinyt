<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

button{font:inherit;cursor:pointer}

svg.i{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:16px;height:72px}
.brand img{height:44px;width:auto;display:block}
.top .sep{width:1px;height:28px;background:var(--line)}
.top .tag{font-family:Poppins;font-weight:600;font-size:15px;color:var(--ink-soft)}
.top .esp{flex:1}
.lnk{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;color:var(--ink);padding:10px 12px;border-radius:10px;background:none;border:0}
.lnk:hover{background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:15px;text-decoration:none;min-height:46px;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:#1c1600;box-shadow:0 6px 18px rgba(244,123,32,.28)}
.btn-gold:hover{background:var(--gold-bright)}
.btn-navy{background:var(--navy);color:#fff}

.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line)}

.btn-wa{background:var(--wa);color:#fff}

.btn-sm{padding:8px 12px;min-height:38px;font-size:14px;border-radius:10px}

.hero h1{font-size:44px;line-height:1.12;font-weight:800;max-width:520px}
.hero h1 span{color:var(--gold)}
.hero p{color:rgba(255,255,255,.78);font-size:18px;max-width:480px;margin:0}
.bens{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px;position:relative;z-index:1}
.bens li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;font-weight:600;font-size:15px}
.bens li .bi{width:38px;height:38px;border-radius:10px;background:rgba(244,123,32,.16);color:var(--gold);display:flex;align-items:center;justify-content:center}

.cartao{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:36px;width:100%;max-width:460px}

.cartao .sub{color:var(--ink-soft);margin:0 0 24px}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.campo label,.rot{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}

.alerta{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:16px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--ground)}
td{padding:16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:15px}

.tabela{padding:0;overflow:hidden}
.acoes{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

details{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
summary{padding:16px 18px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}

details p{margin:0;padding:14px 18px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:50;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}

.rodape{border-top:1px solid var(--line);background:#fff;color:var(--ink-soft);font-size:14px}

.foto-card{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:1.5px dashed var(--line);border-radius:14px;background:#fff center/cover no-repeat;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--ink);padding:8px;position:relative;overflow:hidden}

.foto-card .fc-ico{width:38px;height:38px;border-radius:10px;background:var(--surface-2);color:var(--navy);display:flex;align-items:center;justify-content:center}
.foto-card.feito{border:2px solid var(--ok)}

.foto-card.feito:after{content:'✓';position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
@media (max-width:420px){.foto-card{font-size:12px}}

@media (max-width:1080px){
  .atalhos{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login .hero{padding:44px 24px}
  .hero h1{font-size:32px}
  .corpo{grid-template-columns:1fr;gap:18px;padding-top:0}
  .menu{position:sticky;top:72px;flex-direction:row;overflow-x:auto;border-radius:0;margin:0 -24px;border-left:0;border-right:0;box-shadow:none;padding:8px 16px;scrollbar-width:none;z-index:10}
  .menu button{white-space:nowrap;flex-shrink:0}
  .menu hr{display:none}

  .tabela thead{display:none}
  .tabela tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:16px;border-bottom:1px solid var(--line)}
  .tabela td{border:0;padding:0}
  .tabela td.acoes-td{grid-column:1/-1;margin-top:10px}
  .acoes{justify-content:flex-start}
  .top .tag,.top .sep{display:none}

@media (max-width:560px){
  .wrap{padding:0 16px}
  .menu{margin:0 -16px}
  .bens{grid-template-columns:1fr}
  .atalhos{grid-template-columns:1fr 1fr}
  .cartao{padding:24px 20px}
  .top .lnk-site span{display:none}
  .faixa h1{font-size:26px}
}
</style>

const demo=(path)=>new Promise(ok=>setTimeout(()=>ok(({
  "app-login":{ok:true,sessao:"demo",nome:"Maria Souza",contratos:[{contratoId:"1234",clienteId:"77",plano:"FIBRA 700 MEGA",status:"Ativo",vencimento:10,valorAberto:"99,90",titulos:1,pendencia:true,termoAssinado:false,termoUrl:"https://infinyt.com.br",termoPdf:"https://infinyt.com.br",cidade:"Brasília/DF"},{contratoId:"1290",clienteId:"77",plano:"FIBRA 500 MEGA",status:"Ativo",vencimento:20,valorAberto:null,titulos:0,termoAssinado:true}]},

  "app-notas":{notas:[{numero:"5531",id:"1",data_emissao:"2026-10-01",status:"1",serie:"1"}]},
  "app-wifi-get":{ok:true,redes:[{band:"2.4 GHz",ssid:"INFINYT-Maria"},{band:"5 GHz",ssid:"INFINYT-Maria_5G"}]},
  "app-desbloqueio":{ok:true,mensagem:"Sua conexão foi liberada.",liberado_dias:2},
  "app-recuperar-senha":{ok:true,mensagem:"Pronto! Enviamos sua senha no WhatsApp cadastrado."},
  "app-assinar-contrato":{ok:true,mensagem:"Contrato assinado com sucesso!"},
}[path])||{ok:true}),700));
async function api(path,body){
  if(DEMO)return demo(path);
  const ir=async(base)=>{const r=await fetch(`${base}/${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...(body||{}),...(sessao?{sessao}:{})})});
    if(r.status===401&&path!=="app-login"){sair("Sua sessão expirou. Entre novamente.");throw new Error("sessao");}
    if(!r.ok)throw new Error("HTTP "+r.status);return r.json();};
  try{return await ir(BASE);}catch(e){if(e.message==="sessao")throw e;const outro=BASES.find(b=>b!==BASE);BASE=outro;return ir(outro);}
}
async function carregarConfig(){
  if(DEMO)return;
  for(const b of BASES){try{const r=await fetch(`${b}/app-config`,{cache:"no-store"});const d=await r.json();if(d&&d.ok){BASE=b;CFG={...CFG,...(d.config||{})};break;}}catch(e){}}
  $("#topoWa").href=waLink("Olá! Vim pela Central do Assinante.");
  $("#rodHorario").textContent=CFG.horario; $("#rodTel").textContent=CFG.telefone_exibir;
}

  <div class="grade g2">
    <div class="card"><h3 style="font-size:18px;margin-bottom:6px">Dados do contrato</h3>
      <dl class="lista-dados" style="margin:0"><div><dt>Titular</dt><dd>${esc(S.conta.nome)}</dd></div><div><dt>Plano</dt><dd>${esc(ct.plano||"Internet")}</dd></div><div><dt>Contrato</dt><dd>#${esc(ct.contratoId)}</dd></div><div><dt>Situação</dt><dd>${esc(ct.status||"Ativo")}</dd></div>${ct.vencimento?`<div><dt>Vencimento</dt><dd>Todo dia ${esc(ct.vencimento)}</dd></div>`:""}${ct.cidade?`<div><dt>Cidade</dt><dd>${esc(ct.cidade)}</dd></div>`:""}</dl></div>
    <div class="card" style="text-align:center">

      ${!ct.termoAssinado&&ct.termoUrl?`
      <div id="aceiteBox" style="text-align:left;border-top:1px solid var(--line);padding-top:16px;margin-top:6px">
        ${ct.termoPdf?`<a class="btn btn-line" style="width:100%" href="${esc(ct.termoPdf)}" target="_blank" rel="noopener">${ic("documento")}1. Ler o termo de adesão</a>`:""}
        <p class="rot" style="margin:16px 0 8px">2. Fotos e assinatura</p>
        <div class="fotos-ass">
          <label class="foto-card" data-k="fotoDoc"><input type="file" accept="image/*" capture="environment" hidden><span class="fc-ico">${ic("documento")}</span><span class="fc-txt">Foto do documento</span></label>
          <label class="foto-card" data-k="foto"><input type="file" accept="image/*" capture="user" hidden><span class="fc-ico">${ic("ok")}</span><span class="fc-txt">Selfie com o documento</span></label>
          <button type="button" class="foto-card" id="bAbreAss"><span class="fc-ico">${ic("caneta")}</span><span class="fc-txt">Assinatura</span></button>
        </div>
        <div id="assBox" class="oculto" style="margin-top:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span class="rot">Assine com o dedo ou o mouse</span><button type="button" class="lnk" id="bLimpaAss" style="padding:4px 8px">Limpar</button></div>
          <canvas id="cvAss" style="width:100%;height:180px;background:#fff;border:1.5px dashed var(--line);border-radius:12px;touch-action:none;display:block"></canvas>
          <button type="button" class="btn btn-navy btn-sm" id="bOkAss" style="margin-top:8px">${ic("check")}Usar esta assinatura</button>
        </div>
        <label style="display:flex;gap:10px;align-items:flex-start;margin:16px 0"><input type="checkbox" id="cbAceite" style="width:20px;height:20px;margin-top:2px;accent-color:var(--gold-deep);flex-shrink:0"><span>3. Li e aceito o Termo de Adesão e o Contrato de Prestação de Serviços da Infinyt Net, e confirmo que as fotos são verdadeiras.</span></label>
        <div id="aceiteAviso"></div>
        <button class="btn btn-gold" style="width:100%" id="bAceitar" disabled>${ic("caneta")}Assinar contrato</button>
        <p style="color:var(--ink-soft);font-size:13px;margin:10px 0 0">A assinatura é registrada na plataforma oficial de assinatura eletrônica (SGPsign), com data e hora.</p>
      </div>`:`
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${ct.termoPdf?`<a class="btn btn-line" href="${esc(ct.termoPdf)}" target="_blank" rel="noopener">${ic("documento")}Ver termo (PDF)</a>`:""}
        ${!ct.termoAssinado&&!ct.termoUrl?`<a class="btn btn-wa" href="${waLink("Olá! Quero assinar meu contrato (#"+ct.contratoId+").")}" target="_blank" rel="noopener">${ic("chat")}Pedir link no WhatsApp</a>`:""}
      </div>`}</div>
  </div>`;
  const box=$("#aceiteBox"); if(!box)return;
  const dados={foto:"",fotoDoc:"",assinatura:""};
  const cb=$("#cbAceite"),ba=$("#bAceitar");
  const confere=()=>{ba.disabled=!(dados.foto&&dados.fotoDoc&&dados.assinatura&&cb.checked);};
  // foto reduzida para no máximo 1280px, em JPEG (o SGPsign recebe a imagem como texto base64)
  const reduzir=file=>new Promise((ok,erro)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const max=1280;let w=im.width,h=im.height;if(w>h&&w>max){h=h*max/w;w=max;}else if(h>=w&&h>max){w=w*max/h;h=max;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(im,0,0,w,h);ok(c.toDataURL("image/jpeg",0.72));};im.onerror=erro;im.src=fr.result;};fr.onerror=erro;fr.readAsDataURL(file);});
  box.querySelectorAll("label.foto-card").forEach(l=>{const inp=l.querySelector("input");inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{dados[l.dataset.k]=await reduzir(f);l.classList.add("feito");l.style.backgroundImage=`url(${dados[l.dataset.k]})`;}catch(e){toast("Não deu para ler a foto. Tente outra.");}confere();};});
  const cv=$("#cvAss");let desenhando=false,temTraco=false;
  const preparar=()=>{const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;const x=cv.getContext("2d");x.scale(2,2);x.lineWidth=2.5;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";};
  const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
  const ini=e=>{e.preventDefault();desenhando=true;const p=pos(e),x=cv.getContext("2d");x.beginPath();x.moveTo(p.x,p.y);};
  const mov=e=>{if(!desenhando)return;e.preventDefault();const p=pos(e),x=cv.getContext("2d");x.lineTo(p.x,p.y);x.stroke();temTraco=true;};
  const fim=()=>{desenhando=false;};
  ["mousedown","touchstart"].forEach(ev=>cv.addEventListener(ev,ini,{passive:false}));
  ["mousemove","touchmove"].forEach(ev=>cv.addEventListener(ev,mov,{passive:false}));
  ["mouseup","mouseleave","touchend"].forEach(ev=>cv.addEventListener(ev,fim));
  $("#bAbreAss").onclick=()=>{$("#assBox").classList.remove("oculto");preparar();temTraco=false;};
  $("#bLimpaAss").onclick=()=>{cv.getContext("2d").clearRect(0,0,cv.width,cv.height);temTraco=false;};
  $("#bOkAss").onclick=()=>{if(!temTraco){toast("Desenhe sua assinatura no quadro.");return;}dados.assinatura=cv.toDataURL("image/png");const b=$("#bAbreAss");b.classList.add("feito");b.style.backgroundImage=`url(${dados.assinatura})`;b.style.backgroundSize="contain";$("#assBox").classList.add("oculto");confere();};
  cb.onchange=confere;
  ba.onclick=async()=>{
    ba.disabled=true;ba.textContent="Assinando…";let r;
    try{r=await api("app-assinar-contrato",{termoUrl:ct.termoUrl,nome:S.conta.nome,cpf:S.conta.cpf,foto:dados.foto,fotoDoc:dados.fotoDoc,assinatura:dados.assinatura});}
    catch(e){if(e.message==="sessao")return;r={ok:false};}
    if(r&&r.ok){ct.termoAssinado=true;box.innerHTML=`<div class="alerta ok" style="margin:0">${ic("ok")}<span><b>Contrato assinado!</b> Obrigado. Sua assinatura foi registrada.</span></div>`;return;}
    $("#aceiteAviso").innerHTML=`<div class="alerta bad">${ic("alerta")}<span>${esc((r&&r.mensagem)||"Não foi possível assinar agora. Tente de novo.")}</span></div>`;
    ba.innerHTML=`${ic("caneta")}Assinar contrato`;confere();
  };
}

    <div><h3 style="font-size:18px;margin:0 0 12px">Perguntas frequentes</h3>${faq.map(f=>`<details><summary>${esc(f.q)}${ic("seta","transform:rotate(90deg)")}</summary><p>${esc(f.a)}</p></details>`).join("")}</div>
    <div class="card"><h3 style="font-size:18px;margin-bottom:10px">Atendimento</h3><p style="margin:0 0 14px;display:flex;gap:10px">${ic("calendario")}<span>${esc(CFG.horario)}</span></p><p style="margin:0;display:flex;gap:10px;color:var(--ink-soft)">${ic("local")}<span>${esc(CFG.endereco)}</span></p></div>
  </div>`;
}
