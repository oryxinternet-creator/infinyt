# Site da Infinyt na raiz e o painel em /painel/, servidos de uma pasta só (porta 80 do container).
# O HTTPS fica no Nginx Proxy Manager da frente; por isso os redirecionamentos não levam host nem porta.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # páginas sem ".html" no endereço (internet-residencial -> internet-residencial.html)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /painel { return 301 /painel/; }

    # HTML sempre fresco; imagens e ícones podem ficar em cache
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    location /assets/ { expires 7d; }
}
